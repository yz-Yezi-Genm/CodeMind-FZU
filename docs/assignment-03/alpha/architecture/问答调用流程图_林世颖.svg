<rect x="560" y="70" width="480" height="48" rx="8" fill="#e8f5e9" stroke="#34a853" stroke-width="2"/>
<text x="800.0" y="98.0" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#333333">学生提问（浏览器）</text>
<rect x="560" y="140" width="480" height="48" rx="8" fill="#e8f5e9" stroke="#34a853" stroke-width="2"/>
<text x="800.0" y="168.0" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#333333">POST /api/v1/ask（query、conversation_id）</text>
<rect x="560" y="210" width="480" height="48" rx="8" fill="#e8f5e9" stroke="#34a853" stroke-width="2"/>
<text x="800.0" y="238.0" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#333333">FastAPI 后端：请求校验，生成/沿用 request_id 与 conversation_id，构造 AgentRequest</text>
<rect x="560" y="290" width="480" height="48" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
<text x="800.0" y="318.0" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#333333">Agent 工作流：意图识别与信息完整性判断</text>
<polygon points="800.0,360 980,395.0 800.0,430 620,395.0" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
<text x="800.0" y="399.0" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#333333">信息是否充分？</text>
<rect x="560" y="470" width="480" height="48" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
<text x="800.0" y="498.0" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#333333">调用 Retriever.retrieve() 检索 enabled 状态片段</text>
<polygon points="800.0,535 980,565.0 800.0,595 620,565.0" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
<text x="800.0" y="569.0" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#333333">是否有可用证据？</text>
<rect x="560" y="615" width="480" height="48" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
<text x="800.0" y="643.0" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#333333">调用 LLMClient.generate() 组织回答（模型输出不作为证据）</text>
<rect x="560" y="695" width="480" height="48" rx="8" fill="#e8f5e9" stroke="#34a853" stroke-width="2"/>
<text x="800.0" y="723.0" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#333333">AgentResult 由后端包装为 AskResponse</text>
<rect x="560" y="765" width="480" height="48" rx="8" fill="#e8f5e9" stroke="#34a853" stroke-width="2"/>
<text x="800.0" y="793.0" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#333333">前端展示回答、引用与 warnings；追问场景等待用户补充后再次提交</text>
<rect x="1150" y="300" width="330" height="110" rx="8" fill="#fff8e1" stroke="#f9ab00" stroke-width="2"/>
<text x="1315.0" y="341.0" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#333333">needs_clarification</text>
<text x="1315.0" y="359.0" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#333333">返回 clarifying_question</text>
<text x="1315.0" y="377.0" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#333333">前端展示追问，等待补充信息</text>
<rect x="1150" y="535" width="330" height="110" rx="8" fill="#fff8e1" stroke="#f9ab00" stroke-width="2"/>
<text x="1315.0" y="576.0" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#333333">insufficient_evidence</text>
<text x="1315.0" y="594.0" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#333333">返回解释与 warnings</text>
<text x="1315.0" y="612.0" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#333333">不伪造政策答案，citations 为空</text>
<text x="800.0" y="842" text-anchor="middle" font-size="11" fill="#888888">编制：林世颖 | 日期：2026-11-18 | 状态口径以 Alpha 接口规范 V1.0 为准</text>
</svg>