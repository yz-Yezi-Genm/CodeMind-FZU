<text x="800.0" y="98.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#333333">学生提问（浏览器）</text>
<rect x="560" y="140" width="480" height="48" rx="8" fill="#e8f5e9" stroke="#34a853" stroke-width="2"/>
<text x="800.0" y="168.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#333333">POST /api/v1/ask（query、conversation_id）</text>
<rect x="560" y="210" width="480" height="52" rx="8" fill="#e8f5e9" stroke="#34a853" stroke-width="2"/>
<text x="800.0" y="240.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">后端校验；会话存储按 conversation_id 载入历史，构造 AgentRequest</text>
<rect x="560" y="290" width="480" height="48" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
<text x="800.0" y="318.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#333333">Agent 工作流：业务规则判断意图与信息完整性</text>
<polygon points="800.0,360 980,395.0 800.0,430 620,395.0" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
<text x="800.0" y="399.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#333333">信息是否充分？</text>
<rect x="560" y="470" width="480" height="50" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
<text x="800.0" y="490.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">Retriever.retrieve()：BM25 检索排序</text>
<text x="800.0" y="508.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">仅筛选 enabled 资料；不做来源/时效/人工审核核验</text>
<rect x="560" y="540" width="480" height="56" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
<text x="800.0" y="563.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">AgentWorkflow._eligible() 资格核验</text>
<text x="800.0" y="581.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">来源/时效/生效日期/人工审核标记/元数据一致性</text>
<rect x="560" y="616" width="480" height="50" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
<text x="800.0" y="636.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">alpha_evidence_check 业务适用判断</text>
<text x="800.0" y="654.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">证据是否符合当前问题的业务适用范围</text>
<polygon points="800.0,690 980,720.0 800.0,750 620,720.0" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
<text x="800.0" y="724.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#333333">是否有可用证据？</text>
<rect x="560" y="780" width="480" height="48" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
<text x="800.0" y="808.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">LLMClient.generate() 选取证据摘录，模型输出不作为证据</text>
<polygon points="800.0,855 980,890.0 800.0,925 620,890.0" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
<text x="800.0" y="885.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#333333">引用一致性校验</text>
<text x="800.0" y="903.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#333333">chunk_id 与 quote 一致？</text>
<rect x="560" y="930" width="480" height="48" rx="8" fill="#e8f5e9" stroke="#34a853" stroke-width="2"/>
<text x="800.0" y="958.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#333333">AgentResult 由后端包装为 AskResponse</text>
<rect x="560" y="1000" width="480" height="48" rx="8" fill="#e8f5e9" stroke="#34a853" stroke-width="2"/>
<text x="800.0" y="1028.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">前端展示回答、引用与 warnings；追问场景等待补充后再次提交</text>
<rect x="1150" y="300" width="330" height="110" rx="8" fill="#fff8e1" stroke="#f9ab00" stroke-width="2"/>
<text x="1315.0" y="341.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">needs_clarification</text>
<text x="1315.0" y="359.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">返回 clarifying_question</text>
<text x="1315.0" y="377.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">前端展示追问，等待补充信息</text>
<rect x="1150" y="600" width="330" height="170" rx="8" fill="#fff8e1" stroke="#f9ab00" stroke-width="2"/>
<text x="1315.0" y="662.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">insufficient_evidence</text>
<text x="1315.0" y="680.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">无可用证据，或引用校验失败</text>
<text x="1315.0" y="698.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">伪造 chunk_id / 改写 quote 一律拒绝</text>
<text x="1315.0" y="716.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">返回解释与 warnings，citations 为空，不伪造答案</text>
<text x="800.0" y="1062" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#666666">编制：林世颖 | 日期：2026-11-21 | 状态口径以 Alpha 接口规范 V1.0 为准</text>
</svg>