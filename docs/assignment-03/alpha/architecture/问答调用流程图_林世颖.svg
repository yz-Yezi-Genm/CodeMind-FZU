<text x="800.0" y="450.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">是</text>
<line x1="980" y1="395" x2="1150" y2="355" stroke="#f9ab00" stroke-width="2"/>
<text x="1065.0" y="375.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">否</text>
