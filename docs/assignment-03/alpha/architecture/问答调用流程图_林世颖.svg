<line x1="800" y1="595" x2="800" y2="615" stroke="#9c27b0" stroke-width="2"/>
<text x="800.0" y="605.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">是</text>
<line x1="980" y1="565" x2="1150" y2="600" stroke="#f9ab00" stroke-width="2"/>
<text x="1065.0" y="582.5" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">否</text>
<line x1="800" y1="663" x2="800" y2="685" stroke="#9c27b0" stroke-width="2"/>
<line x1="800" y1="755" x2="800" y2="790" stroke="#9c27b0" stroke-width="2"/>
<text x="800.0" y="772.5" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">是</text>
<line x1="980" y1="720" x2="1150" y2="660" stroke="#f9ab00" stroke-width="2"/>
<text x="1065.0" y="690.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">否</text>
<line x1="800" y1="838" x2="800" y2="860" stroke="#34a853" stroke-width="2"/>
<line x1="1150" y1="410" x2="1040" y2="884" stroke="#f9ab00" stroke-width="2" stroke-dasharray="6,5"/>
<line x1="1150" y1="720" x2="1040" y2="884" stroke="#f9ab00" stroke-width="2" stroke-dasharray="6,5"/>
<rect x="560" y="70" width="480" height="48" rx="8" fill="#e8f5e9" stroke="#34a853" stroke-width="2"/>
<text x="800.0" y="98.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#333333">学生提问（浏览器）</text>
<rect x="560" y="140" width="480" height="48" rx="8" fill="#e8f5e9" stroke="#34a853" stroke-width="2"/>
<text x="800.0" y="168.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#333333">POST /api/v1/ask（query、conversation_id）</text>
<rect x="560" y="210" width="480" height="52" rx="8" fill="#e8f5e9" stroke="#34a853" stroke-width="2"/>
<text x="800.0" y="240.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">后端校验；会话存储按 conversation_id 载入历史，构造 AgentRequest</text>
<rect x="560" y="290" width="480" height="48" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
<text x="800.0" y="318.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#333333">Agent 工作流：业务规则判断意图与信息完整性</text>
<polygon points="800.0,360 980,395.0 800.0,430 620,395.0" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
<text x="800.0" y="399.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#333333">信息是否充分？</text>
<rect x="560" y="470" width="480" height="48" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
<text x="800.0" y="498.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">Retriever.retrieve() 检索 enabled 且来源/时效/人工批准通过的片段</text>
<polygon points="800.0,535 980,565.0 800.0,595 620,565.0" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
<text x="800.0" y="569.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#333333">是否有可用证据？</text>
<rect x="560" y="615" width="480" height="48" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
<text x="800.0" y="643.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">LLMClient.generate() 选取证据摘录，模型输出不作为证据</text>
<polygon points="800.0,685 980,720.0 800.0,755 620,720.0" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
<text x="800.0" y="715.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#333333">引用一致性校验</text>
<text x="800.0" y="733.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#333333">chunk_id 与 quote 一致？</text>
<rect x="560" y="790" width="480" height="48" rx="8" fill="#e8f5e9" stroke="#34a853" stroke-width="2"/>
<text x="800.0" y="818.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#333333">AgentResult 由后端包装为 AskResponse</text>
<rect x="560" y="860" width="480" height="48" rx="8" fill="#e8f5e9" stroke="#34a853" stroke-width="2"/>
<text x="800.0" y="888.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">前端展示回答、引用与 warnings；追问场景等待补充后再次提交</text>
<rect x="1150" y="300" width="330" height="110" rx="8" fill="#fff8e1" stroke="#f9ab00" stroke-width="2"/>
<text x="1315.0" y="341.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">needs_clarification</text>
<text x="1315.0" y="359.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">返回 clarifying_question</text>
<text x="1315.0" y="377.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">前端展示追问，等待补充信息</text>
<rect x="1150" y="560" width="330" height="160" rx="8" fill="#fff8e1" stroke="#f9ab00" stroke-width="2"/>
<text x="1315.0" y="617.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">insufficient_evidence</text>
<text x="1315.0" y="635.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">无可用证据，或引用校验失败</text>
<text x="1315.0" y="653.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">伪造 chunk_id / 改写 quote 一律拒绝</text>
<text x="1315.0" y="671.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">返回解释与 warnings，citations 为空，不伪造答案</text>
<text x="800.0" y="922" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#666666">编制：林世颖 | 日期：2026-11-21 | 状态口径以 Alpha 接口规范 V1.0 为准</text>
</svg>