<polygon points="1150.0,381.0 1140.4,383.8 1141.5,375.7" fill="#f9ab00"/>
<text x="1065.0" y="369.5" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">否</text>
<line x1="800" y1="476" x2="800" y2="494" stroke="#9c27b0" stroke-width="2"/>
<polygon points="800.0,494.0 795.9,484.9 804.1,484.9" fill="#9c27b0"/>
<line x1="800" y1="556" x2="800" y2="574" stroke="#9c27b0" stroke-width="2"/>
<polygon points="800.0,574.0 795.9,564.9 804.1,564.9" fill="#9c27b0"/>
<line x1="800" y1="624" x2="800" y2="642" stroke="#f9ab00" stroke-width="2"/>
<polygon points="800.0,642.0 795.9,632.9 804.1,632.9" fill="#f9ab00"/>
<line x1="800" y1="698" x2="800" y2="716" stroke="#f9ab00" stroke-width="2"/>
<polygon points="800.0,716.0 795.9,706.9 804.1,706.9" fill="#f9ab00"/>
<line x1="800" y1="766" x2="800" y2="784" stroke="#34a853" stroke-width="2"/>
<polygon points="800.0,784.0 795.9,774.9 804.1,774.9" fill="#34a853"/>
<line x1="800" y1="830" x2="800" y2="850" stroke="#34a853" stroke-width="2"/>
<polygon points="800.0,850.0 795.9,840.9 804.1,840.9" fill="#34a853"/>
<line x1="980" y1="525" x2="1150" y2="645" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6,5"/>
<polygon points="1150.0,645.0 1140.2,643.1 1144.9,636.4" fill="#9e9e9e"/>
<line x1="1150" y1="436" x2="1040" y2="873" stroke="#f9ab00" stroke-width="2" stroke-dasharray="6,5"/>
<polygon points="1040.0,873.0 1038.3,863.1 1046.2,865.1" fill="#f9ab00"/>
<rect x="560" y="56" width="480" height="46" rx="8" fill="#e8f5e9" stroke="#34a853" stroke-width="2"/>
<text x="800.0" y="83.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#333333">学生提交问题（浏览器）</text>
<rect x="560" y="122" width="480" height="46" rx="8" fill="#e8f5e9" stroke="#34a853" stroke-width="2"/>
<text x="800.0" y="149.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#333333">POST /api/v1/ask（query、conversation_id）</text>
<rect x="560" y="188" width="480" height="52" rx="8" fill="#e8f5e9" stroke="#34a853" stroke-width="2"/>
<text x="800.0" y="209.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">后端接收请求；会话存储按 conversation_id 读取历史</text>
<text x="800.0" y="227.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">构造 AgentRequest 交给 Agent 工作流</text>
<rect x="560" y="260" width="480" height="46" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
<text x="800.0" y="287.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#333333">Agent 识别 S1—S4 业务场景</text>
<polygon points="800.0,326 980,358.0 800.0,390 620,358.0" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
<text x="800.0" y="362.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#333333">必要信息是否充分？</text>
<rect x="560" y="426" width="480" height="50" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
<text x="800.0" y="446.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">Retriever.retrieve()：BM25 检索排序</text>
<text x="800.0" y="464.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">方向不确定时不传 business_direction_code，全库检索</text>
<rect x="560" y="494" width="480" height="62" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
<text x="800.0" y="520.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">来源 / 适用范围 / 审核状态 / 时效检查（证据门禁）</text>
<text x="800.0" y="538.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">历史资料按问题时间范围选择并标注 historical，不得冒充现行政策</text>
<rect x="560" y="574" width="480" height="50" rx="8" fill="#fff8e1" stroke="#f9ab00" stroke-width="2"/>
<text x="800.0" y="594.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">合格证据交给 Qwen（受约束生成）</text>
<text x="800.0" y="612.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">Agent 分配临时 evidence_id 并保存与真实片段的映射</text>
<rect x="560" y="642" width="480" height="56" rx="8" fill="#fff8e1" stroke="#f9ab00" stroke-width="2"/>
<text x="800.0" y="665.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">Agent 校验模型输出</text>
<text x="800.0" y="683.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">JSON 格式 · answer 非空 · ID 存在且属于本次门禁集合</text>
<rect x="560" y="716" width="480" height="50" rx="8" fill="#e8f5e9" stroke="#34a853" stroke-width="2"/>
<text x="800.0" y="736.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">Agent 按真实检索片段构造 Citation</text>
<text x="800.0" y="754.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">模型不自行创建 Citation</text>
<rect x="560" y="784" width="480" height="46" rx="8" fill="#e8f5e9" stroke="#34a853" stroke-width="2"/>
<text x="800.0" y="811.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#333333">返回统一 AskResponse</text>
<rect x="560" y="850" width="480" height="46" rx="8" fill="#e8f5e9" stroke="#34a853" stroke-width="2"/>
<text x="800.0" y="877.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">前端展示回答、引用与 warnings</text>
<rect x="1150" y="326" width="330" height="110" rx="8" fill="#fff8e1" stroke="#f9ab00" stroke-width="2"/>
<text x="1315.0" y="358.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">needs_clarification</text>
<text x="1315.0" y="376.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">返回 clarifying_question</text>
<text x="1315.0" y="394.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">追问不调用 Retriever 和 Qwen</text>
<text x="1315.0" y="412.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#333333">前端展示追问，补充信息后再次提交</text>
<rect x="1150" y="560" width="330" height="170" rx="8" fill="#fafafa" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6,5"/>
<text x="1315.0" y="613.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#757575">insufficient_evidence 安全回退</text>
<text x="1315.0" y="631.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#757575">无合格证据 / 校验失败 / 非法 JSON</text>
<text x="1315.0" y="649.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#757575">未知 ID 或跨请求 ID / 空答案</text>
<text x="1315.0" y="667.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#757575">answer_mode=insufficient_data，citations 为空</text>
<text x="1315.0" y="685.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#757575">不伪造政策答案与引用</text>
<text x="800.0" y="922" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#666666">编制：林世颖 | 日期：2026-11-23 | 追问阶段不调用检索与模型；证据不足按 HTTP 200 返回 insufficient_evidence</text>
</svg>