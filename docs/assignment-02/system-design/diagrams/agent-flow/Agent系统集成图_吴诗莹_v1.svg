<text x="48" y="43.480000000000004" text-anchor="start" font-family="Microsoft YaHei" font-size="18" font-weight="700" fill="#087E82">CODEMIND-FZU  /  AGENT DESIGN</text>
<text x="48" y="93.24" text-anchor="start" font-family="Microsoft YaHei" font-size="34" font-weight="700" fill="#182D45">Agent 与软件系统集成</text>
<text x="48" y="130.34" text-anchor="start" font-family="Microsoft YaHei" font-size="19" font-weight="400" fill="#53677F">v1.0 采用单体 FastAPI：前端不直连模型、索引或联网工具。</text>
