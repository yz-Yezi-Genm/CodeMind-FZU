<text x="228.0" y="521.3000000000001" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="400" fill="#182D45">HTML / CSS / JS</text>
<text x="228.0" y="549.7" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="400" fill="#182D45">Web 前端</text>
<text x="228.0" y="578.1" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="400" fill="#182D45">保留上下文并重新提交</text>
<rect x="515" y="260" width="350" height="115" rx="14" fill="#EEF4FF" stroke="#285FC7" stroke-width="1.6"/>
<text x="690.0" y="296.3" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="400" fill="#182D45">Ask API  /api/ask</text>
<text x="690.0" y="324.7" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="400" fill="#182D45">参数校验、异常处理</text>
<text x="690.0" y="353.1" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="400" fill="#182D45">返回 answerStatus</text>
<rect x="940" y="260" width="330" height="115" rx="14" fill="#EEF4FF" stroke="#285FC7" stroke-width="1.6"/>
<text x="1105.0" y="296.3" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="400" fill="#182D45">TaskRouter + Clarifier</text>
<text x="1105.0" y="324.7" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="400" fill="#182D45">任务识别、策略路由</text>
<text x="1105.0" y="353.1" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="400" fill="#182D45">必要时主动追问</text>
<rect x="650" y="500" width="440" height="135" rx="14" fill="#EAF7F5" stroke="#087E82" stroke-width="1.6"/>
<text x="870.0" y="544.18" text-anchor="middle" font-family="Microsoft YaHei" font-size="22" font-weight="400" fill="#182D45">AgentOrchestrator</text>
<text x="870.0" y="575.42" text-anchor="middle" font-family="Microsoft YaHei" font-size="22" font-weight="400" fill="#182D45">受控任务编排</text>
<text x="870.0" y="606.66" text-anchor="middle" font-family="Microsoft YaHei" font-size="22" font-weight="400" fill="#182D45">不作为独立微服务</text>
<rect x="515" y="760" width="350" height="125" rx="14" fill="#EEF4FF" stroke="#285FC7" stroke-width="1.6"/>
<text x="690.0" y="801.3000000000001" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="400" fill="#182D45">HybridRetriever</text>
<text x="690.0" y="829.7" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="400" fill="#182D45">Chroma + BM25 + RRF</text>
<text x="690.0" y="858.1" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="400" fill="#182D45">本地资料优先</text>
<rect x="940" y="760" width="330" height="125" rx="14" fill="#EAF7F5" stroke="#087E82" stroke-width="1.6"/>
<text x="1105.0" y="802.36" text-anchor="middle" font-family="Microsoft YaHei" font-size="19" font-weight="400" fill="#182D45">EvidenceVerifier</text>
<text x="1105.0" y="829.34" text-anchor="middle" font-family="Microsoft YaHei" font-size="19" font-weight="400" fill="#182D45">生成前证据筛选</text>
<text x="1105.0" y="856.32" text-anchor="middle" font-family="Microsoft YaHei" font-size="19" font-weight="400" fill="#182D45">输出核验证据与政策状态</text>
<rect x="515" y="1030" width="350" height="125" rx="14" fill="#EAF7F5" stroke="#087E82" stroke-width="1.6"/>
<text x="690.0" y="1072.36" text-anchor="middle" font-family="Microsoft YaHei" font-size="19" font-weight="400" fill="#182D45">AnswerVerifier</text>
<text x="690.0" y="1099.34" text-anchor="middle" font-family="Microsoft YaHei" font-size="19" font-weight="400" fill="#182D45">生成后复核回答、引用</text>
<text x="690.0" y="1126.32" text-anchor="middle" font-family="Microsoft YaHei" font-size="19" font-weight="400" fill="#182D45">与 policyStatus</text>
<rect x="940" y="1030" width="330" height="125" rx="14" fill="#EAF7F5" stroke="#087E82" stroke-width="1.6"/>
<text x="1105.0" y="1072.36" text-anchor="middle" font-family="Microsoft YaHei" font-size="19" font-weight="400" fill="#182D45">AnswerComposer</text>
<text x="1105.0" y="1099.34" text-anchor="middle" font-family="Microsoft YaHei" font-size="19" font-weight="400" fill="#182D45">组织答案、来源、限制</text>
<text x="1105.0" y="1126.32" text-anchor="middle" font-family="Microsoft YaHei" font-size="19" font-weight="400" fill="#182D45">和下一步建议</text>
<rect x="1450" y="330" width="440" height="135" rx="14" fill="#EEF4FF" stroke="#285FC7" stroke-width="1.6"/>
<text x="1670.0" y="376.3" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="400" fill="#182D45">本地知识资产与索引</text>
<text x="1670.0" y="404.7" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="400" fill="#182D45">官方原文 / 整理稿 / CSV</text>
<text x="1670.0" y="433.1" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="400" fill="#182D45">Chroma + BM25（统一版本）</text>
<rect x="1450" y="680" width="440" height="115" rx="14" fill="#EAF7F5" stroke="#087E82" stroke-width="1.6"/>
<text x="1670.0" y="716.3000000000001" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="400" fill="#182D45">LLMAdapter / Qwen API</text>
<text x="1670.0" y="744.7" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="400" fill="#182D45">只基于已核验证据</text>
<text x="1670.0" y="773.1" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="400" fill="#182D45">生成回答草稿</text>
<rect x="1450" y="970" width="440" height="125" rx="14" fill="#FFF5E5" stroke="#A96712" stroke-width="1.6"/>
<text x="1670.0" y="1011.3000000000001" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="400" fill="#182D45">Tavily（候选能力）</text>
<text x="1670.0" y="1039.7" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="400" fill="#182D45">仅由 EvidenceVerifier 按需调用</text>
<text x="1670.0" y="1068.1000000000001" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="400" fill="#182D45">结果回到核验流程</text>
