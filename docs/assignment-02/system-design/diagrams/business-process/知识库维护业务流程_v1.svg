<rect x="280.0" y="412.0" width="200.0" height="56.0" rx="11" fill="#f3f7f4" stroke="#4a7c59" stroke-width="1.4" filter="url(#soft)"/><text x="380" y="443.5" font-size="13" fill="#2e3532" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><tspan x="380" dy="0">采集原始文件（网页/附件）</tspan></text>
<polygon points="380,504 470,550 380,596 290,550" fill="#fbf4e8" stroke="#b98234" stroke-width="1.4" filter="url(#soft)"/><text x="380" y="544.0" font-size="12" fill="#2e3532" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><tspan x="380" dy="0">正文提取</tspan><tspan x="380" dy="18">是否成功？</tspan></text>
<rect x="700.0" y="520.0" width="200.0" height="56.0" rx="11" fill="#faf1f1" stroke="#a85555" stroke-width="1.4" filter="url(#soft)"/><text x="800" y="542.0" font-size="13" fill="#2e3532" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><tspan x="800" dy="0">标记待 OCR/待处理</tspan><tspan x="800" dy="19">退回重新处理</tspan></text>
<rect x="280.0" y="632.0" width="200.0" height="56.0" rx="11" fill="#f3f7f4" stroke="#4a7c59" stroke-width="1.4" filter="url(#soft)"/><text x="380" y="654.0" font-size="13" fill="#2e3532" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><tspan x="380" dy="0">人工核验来源、日期、</tspan><tspan x="380" dy="19">适用范围与政策时效</tspan></text>
<polygon points="380,724 470,770 380,816 290,770" fill="#fbf4e8" stroke="#b98234" stroke-width="1.4" filter="url(#soft)"/><text x="380" y="764.0" font-size="12" fill="#2e3532" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><tspan x="380" dy="0">核验</tspan><tspan x="380" dy="18">是否通过？</tspan></text>
