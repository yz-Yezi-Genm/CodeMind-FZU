<rect x="280.0" y="852.0" width="200.0" height="56.0" rx="11" fill="#f3f7f4" stroke="#4a7c59" stroke-width="1.4" filter="url(#soft)"/><text x="380" y="874.0" font-size="13" fill="#2e3532" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><tspan x="380" dy="0">标注政策状态：有效、学期</tspan><tspan x="380" dy="19">有效、待核验、历史、废止</tspan></text>
