<rect x="700.0" y="1466.0" width="200.0" height="56.0" rx="11" fill="#faf1f1" stroke="#a85555" stroke-width="1.4" filter="url(#soft)"/><text x="800" y="1488.0" font-size="13" fill="#2e3532" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><tspan x="800" dy="0">发布中止，保留上一版完整索引</tspan><tspan x="800" dy="19">构建中索引不被 Agent 使用</tspan></text>
