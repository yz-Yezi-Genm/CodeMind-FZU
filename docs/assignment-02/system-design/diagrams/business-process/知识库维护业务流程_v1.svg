<rect x="700.0" y="210.0" width="200.0" height="56.0" rx="11" fill="#fbfcfb" stroke="#8a9490" stroke-width="1.4" filter="url(#soft)"/><text x="800" y="241.5" font-size="13" fill="#2e3532" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><tspan x="800" dy="0">未发现，等待下一次扫描</tspan></text>
