<rect x="280.0" y="1164.0" width="200.0" height="64.0" rx="11" fill="#f3f7f4" stroke="#4a7c59" stroke-width="1.4" filter="url(#soft)"/><text x="380" y="1180.5" font-size="13" fill="#2e3532" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><tspan x="380" dy="0">双索引构建（同一 versionId）</tspan><tspan x="380" dy="19">ChromaBuilder 向量索引</tspan><tspan x="380" dy="19">BM25Builder 倒排索引</tspan></text>
<rect x="280.0" y="1260.0" width="200.0" height="64.0" rx="11" fill="#f3f7f4" stroke="#4a7c59" stroke-width="1.4" filter="url(#soft)"/><text x="380" y="1286.0" font-size="13" fill="#2e3532" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><tspan x="380" dy="0">QualityGate 质量闸门：</tspan><tspan x="380" dy="19">汇总双索引与元数据状态</tspan></text>
