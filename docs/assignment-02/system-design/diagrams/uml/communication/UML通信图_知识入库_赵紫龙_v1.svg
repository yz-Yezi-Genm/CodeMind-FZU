<text x="930" y="82" text-anchor="middle" font-size="20" font-weight="400" fill="#5B6578">本地资料 → CSV/Chroma/BM25 → 双索引质量闸门 → 测试 → 发布与状态反馈</text>
<text x="930" y="1111" text-anchor="middle" font-size="16" font-weight="400" fill="#5B6578">编制：赵紫龙  |  版本：v1.0  |  日期：2026-11-08  |  项目知识库基准 44 条；当前仓库 CSV 31 条，仅表示现有索引记录</text>
<rect x="70" y="70" width="620" height="115" rx="12" fill="#FFFFFF" stroke="#EDF1F6" stroke-width="2"/><text x="86" y="97" font-size="17" font-weight="700" fill="#172033">质量闸门</text>
<text x="86" y="123" font-size="14" fill="#5B6578">只有 Chroma 与 BM25 均 PASS，QualityGate 才允许测试</text>
<text x="86" y="144" font-size="14" fill="#5B6578">CSV 只表示元数据状态，不替代两个索引的构建结果</text>
<text x="86" y="165" font-size="14" fill="#5B6578">任意索引失败：不进入发布，保留上一可用版本</text>
