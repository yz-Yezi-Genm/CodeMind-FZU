<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="面向福州大学学生的校园事务与发展信息助手" />
    <title>CodeMind-FZU · 演示登录</title>
    <link rel="icon" href="/src/student/assets/fzu.png" />
    <style>
      #student-startup[hidden], #demo-entry[hidden], #demo-workspace[hidden] { display: none; }
      #student-startup {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: auto;
        padding: 24px;
        background: #f6f5f2;
        color: #1f2937;
        font: 16px/1.6 "Microsoft YaHei", system-ui, sans-serif;
      }
      .startup-card { box-sizing: border-box; width: min(100%, 440px); }
      .startup-card h1 { margin: 0 0 8px; font-size: 26px; }
      .startup-card p { margin: 0 0 16px; }
      .startup-card a { color: #a91d35; font-weight: 600; text-underline-offset: 3px; }
    </style>
  </head>
  <body>
    <div id="student-startup">
      <div class="startup-card">
        <h1>CodeMind-FZU</h1>
        <p id="student-startup-message" role="status">正在加载学生端…</p>
        <a id="student-local-link" href="http://127.0.0.1:5173/" hidden>打开本地学生端</a>
        <noscript><p>请启用 JavaScript 后刷新页面。</p></noscript>
      </div>
    </div>
    <main id="demo-entry" class="demo-entry" hidden>
      <canvas id="pointer-field" aria-hidden="true"></canvas>
      <div class="ripple-plane" aria-hidden="true"></div>
      <header class="demo-header">
        <div class="demo-brand"><img src="/src/student/assets/fzu.png" alt="福州大学校徽" width="42" height="42"><strong>CodeMind-FZU</strong></div>
      </header>

      <div class="demo-layout">
        <div class="sign-in-backlight" aria-hidden="true">
          <i class="glass-figure glass-figure-near"></i>
          <i class="glass-figure glass-figure-far"></i>
        </div>
        <section class="demo-sign-in" aria-labelledby="demo-title">
          <div class="sign-in-heading">
            <h1 id="demo-title">账号登录</h1>
            <div class="sign-in-progress" aria-hidden="true"><span></span><span></span></div>
          </div>
          <form id="demo-form" autocomplete="off" novalidate>
            <label for="demo-account">用户名</label>
            <input id="demo-account" required placeholder="请输入用户名" aria-describedby="demo-feedback">
            <label for="demo-password">密码</label>
            <div class="password-field">
              <input id="demo-password" type="password" inputmode="numeric" required autocomplete="off" placeholder="请输入密码" aria-describedby="demo-feedback">
              <button id="show-password" type="button" aria-label="显示密码" aria-controls="demo-password">
                <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.6"/></svg>
                <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 6.1A10.6 10.6 0 0 1 12 6c6.4 0 10 6 10 6a15.3 15.3 0 0 1-2.5 2.9M16.5 17a11 11 0 0 1-4.5 1c-6.4 0-10-6-10-6a15 15 0 0 1 3.8-4.1M10.2 10.2a2.6 2.6 0 0 0 3.6 3.6"/></svg>
              </button>
            </div>
            <p id="demo-feedback" role="status" aria-atomic="true"></p>
            <button id="demo-submit" type="submit" disabled><span id="demo-submit-label">登录</span></button>
          </form>
        </section>
        <section class="demo-overview" aria-labelledby="preview-title">
          <div class="preview-intro">
            <h2 id="preview-title">校园问答，有据可查</h2>
            <p id="preview-summary">从奖学金申报到科研入门，先找到适用的资料。</p>
          </div>

          <div class="demo-illustration">
            <div class="art-index">
              <div class="index-deck" role="group" aria-label="资料索引">
                <button class="sheet sheet-far" type="button" data-sheet-tone="resources" aria-pressed="false">
                  <span class="sheet-title"><img src="/src/student/assets/resources.svg" alt=""><strong>资源目录</strong></span>
                  <span class="sheet-lines" aria-hidden="true"></span>
                </button>
                <button class="sheet sheet-mid" type="button" data-sheet-tone="study" aria-pressed="false">
                  <span class="sheet-title"><img src="/src/student/assets/study.svg" alt=""><strong>学院细则</strong></span>
                  <span class="sheet-lines" aria-hidden="true"></span>
                </button>
                <button class="sheet sheet-front" type="button" data-sheet-tone="policy" aria-pressed="true">
                  <span class="sheet-title"><img src="/src/student/assets/policy.svg" alt=""><strong>校园资料</strong></span>
                  <span class="sheet-lines" aria-hidden="true"></span>
                </button>
              </div>
              <div class="index-lookup" data-sheet-tone="policy" aria-hidden="true">
                <div class="lookup-query"><img src="/src/student/assets/search.svg" alt=""><span>校园资料</span></div>
                <div class="lookup-snippet"><i></i><i></i></div>
                <div class="lookup-source"><img src="/src/student/assets/policy.svg" alt="">资料出处</div>
              </div>
            </div>
          </div>
        </section>
      </div>
      <ul class="campus-topics" aria-label="可查询的校园主题">
        <li><div class="campus-topic-card"><img src="/src/student/assets/policy.svg" alt=""><div><strong>政策与事务</strong><span>奖学金申报、综测、教务</span></div></div></li>
        <li><div class="campus-topic-card"><img src="/src/student/assets/study.svg" alt=""><div><strong>升学发展</strong><span>推免条件、升学政策</span></div></div></li>
        <li><div class="campus-topic-card"><img src="/src/student/assets/research.svg" alt=""><div><strong>竞赛科研</strong><span>竞赛认定、科研入门</span></div></div></li>
        <li><div class="campus-topic-card"><img src="/src/student/assets/resources.svg" alt=""><div><strong>学院资源</strong><span>导师主页、实验室信息</span></div></div></li>
      </ul>
    </main>
    <div id="demo-workspace" class="student-workspace" hidden>
      <header class="student-brand">
        <img src="/src/student/assets/fzu.png" alt="" width="48" height="48" />
        <div><strong>CodeMind-FZU</strong><small>福州大学 · 校园成长助手</small></div>
      </header>
      <div class="student-toolbar">
        <a class="student-active-tab" href="#ask-input">
          <img src="/src/student/assets/search.svg" alt="" />校园问答
        </a>
        <div class="student-health" role="status">
          <span id="health-dot" class="status-dot" aria-hidden="true"></span>
          <span id="health-text">正在检查后端连接…</span>
          <button id="health-retry" type="button" hidden>重试</button>
        </div>
      </div>

      <aside class="student-sidebar">
        <button id="new-chat" class="student-new-chat" type="button">＋ 新建对话</button>
        <div class="student-sidebar-current">
          <img src="/src/student/assets/home.svg" alt="" />
          <span id="conversation-title">首页 / 工作台</span>
        </div>
      </aside>

      <main class="student-main">
        <section id="student-welcome" aria-labelledby="student-heading">
          <div class="student-welcome">
            <p class="student-welcome-eyebrow"><span aria-hidden="true">✦</span> 校园成长信息助手</p>
            <h1 id="student-heading">今天想解决什么问题？</h1>
            <p>从校园事务查询到发展信息获取，让每一步都有依据。</p>
          </div>
          <div id="student-topics" class="student-topics" aria-label="校园问答主题">
            <button type="button" data-query="申请校级奖学金需要满足什么条件？">
              <span class="student-topic-icon"><img src="/src/student/assets/policy.svg" alt="" /></span>
              <span class="student-topic-copy"><strong>奖学金申请</strong><small>查询奖学金申请条件和材料要求。</small></span>
            </button>
            <button type="button" data-query="申请推免需要满足哪些基本条件？">
              <span class="student-topic-icon"><img src="/src/student/assets/study.svg" alt="" /></span>
              <span class="student-topic-copy"><strong>推免条件咨询</strong><small>查询推免资格和流程。</small></span>
            </button>
            <button type="button" data-query="我参加的竞赛可以认定创新学分吗？">
              <span class="student-topic-icon"><img src="/src/student/assets/research.svg" alt="" /></span>
              <span class="student-topic-copy"><strong>竞赛认定</strong><small>查询竞赛级别和创新学分认定要求。</small></span>
            </button>
            <button type="button" data-query="学院有哪些可以参与科研实践的实验室？">
              <span class="student-topic-icon"><img src="/src/student/assets/resources.svg" alt="" /></span>
              <span class="student-topic-copy"><strong>学院资源导航</strong><small>查找实验室和科研实践的公开资料。</small></span>
            </button>
          </div>
        </section>

        <section id="ask-result" class="student-thread" role="log" aria-label="问答记录"></section>

        <div class="student-composer">
          <p id="ask-status" class="student-request-status" role="status"></p>
          <form id="ask-form" class="student-form">
            <label for="ask-input" class="student-sr-only">输入问题</label>
            <textarea id="ask-input" rows="1" maxlength="4000"
              placeholder="描述你的问题，例如：学院有哪些公开科研资源？"></textarea>
            <div class="student-form-actions">
              <button id="ask-button" type="submit">发送</button>
            </div>
          </form>
          <p class="student-disclaimer">政策信息请以学校和学院发布的正式通知为准。</p>
        </div>
      </main>
    </div>
    <script>
      if (location.protocol === 'file:') {
        document.querySelector('#student-startup-message').textContent =
          '请在项目根目录运行 start_demo.bat，或在 frontend 目录运行 npm run dev，然后打开本地学生端。';
        document.querySelector('#student-local-link').hidden = false;
      }
    </script>
    <script type="module">
      if (location.protocol !== 'file:') {
        import('./src/student/demo-entry.ts').catch(() => {
          document.querySelector('#student-startup-message').textContent =
            '学生端加载失败，请确认前端服务已启动，然后刷新页面。';
        });
      }
    </script>
  </body>
</html>
